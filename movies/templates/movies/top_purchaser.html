{% extends 'base.html' %}
{% block content %}
<div class="p-3">
    <div class="container">
      <div class="row mt-3">
        <div class="col-md-6 mx-auto mb-3">
            <h2>Top Purchaser</h2>
            <hr/>
            {% if template_data.top_user %}
            <p><b>Username: </b>{{template_data.top_user.username}}</p>
            <p><b>Movies Purchased: </b>{{template_data.top_user.movies_purchased}}</p>
            {% else %}
            <p>No movies have been purchased yet </p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock content %}
